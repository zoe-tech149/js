<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Results</title>

    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <h1>Student Result Summary</h1>

    <h3>Student: <span id="student-name"></span></h3>

    <table>
      <tr>
        <th>Subject</th>
        <th>Marks (&#x25)</th>
      </tr>

      <tr>
        <td>Accounting</td>
        <td><span id="subject-1-marks"></span></td>
      </tr>

      <tr>
        <td>Mathematics</td>
        <td><span id="subject-2-marks"></span></td>
      </tr>

      <tr>
        <td>Physical Sciences</td>
        <td><span id="subject-3-marks"></span></td>
      </tr>
    </table>

    <p>Average: <span id="student-average"></span></p>

    <script src="script.js"></script>
   
  </body>

</html>
