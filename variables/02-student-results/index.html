<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Results</title>

    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <h1>Student Results</h1>

    <h2>Student: <span id="student-name"></span></h2>

    <table>

      <caption>Subject marks</caption>

      <thead>
        <tr>
          <th scope="col">Subject</th>
          <th scope="col">Marks (&#x25;)</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Accounting</td>
          <td><span id="subject-1-marks"></span></td>
        </tr>

        <tr>
          <td>Mathematics</td>
          <td><span id="subject-2-marks"></span></td>
        </tr>

        <tr>
          <td>Physical Sciences</td>
          <td><span id="subject-3-marks"></span></td>
        </tr>        
      </tbody>

    </table>

    <p>Total marks: <span id="total-marks"></span></p>

    <p>Average: <span id="student-average"></span></p>

    <script src="script.js"></script>
   
  </body>

</html>
